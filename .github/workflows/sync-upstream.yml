# Hourly merge of upstream yetanotherbrowser/yab main into this fork's main and canary, and
# half an hour later a release of canary when upstream shipped a new version or the fork has changes since the last one.

name: Sync upstream

on:
  schedule:
    # Each job keys on its own cron string; keep them in step with the `if:` lines below.
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/yetanotherbrowser/yab.git
  UPSTREAM_BRANCH: main
  BRANCHES: main canary

jobs:
  sync:
    name: Merge upstream
    if: github.repository == 'Serubin/yab' && github.event.schedule != '30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GITHUB_TOKEN may not push commits that touch .github/workflows; SYNC_TOKEN needs contents and workflows write.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keeps the fork's push credential off the upstream fetch.
          git -c http.https://github.com/.extraheader= \
            fetch --no-tags "$UPSTREAM_URL" "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"

          failed=()
          for branch in $BRANCHES; do
            git checkout -q -B "$branch" "origin/$branch"
            if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
              echo "$branch: up to date"
              continue
            fi
            if ! git -c core.hooksPath=/dev/null merge --no-edit \
                -m "Merge upstream $UPSTREAM_BRANCH into $branch" "upstream/$UPSTREAM_BRANCH"; then
              git diff --name-only --diff-filter=U | sed "s/^/::error::$branch conflict: /"
              git merge --abort
              failed+=("$branch")
              continue
            fi
            git push origin "HEAD:refs/heads/$branch"
            echo "$branch: merged $(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Merge conflicts on: ${failed[*]}. Merge upstream by hand."
            exit 1
          fi

  release:
    name: Release canary if it has news
    needs: sync
    # Runs when sync was skipped or hit a conflict on main: canary's own changes still deserve a release.
    if: ${{ !cancelled() && github.repository == 'Serubin/yab' && github.event.schedule != '0 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: canary
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Decide and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM_URL" "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          head="$(git rev-parse HEAD)"
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          busy="$(gh run list -R "$REPO" --workflow release.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$busy" != 0 ]; then say "release: one is already running or queued"; exit 0; fi

          # Releases that shipped but whose Pages deploy failed: redeploy, up to three attempts.
          read -r run_id attempt < <(gh run list -R "$REPO" --workflow release.yml --branch canary \
            --status completed --limit 1 --json databaseId,attempt \
            --jq '.[0] | "\(.databaseId // "-") \(.attempt // 0)"' || echo "- 0")
          if [ "$run_id" != - ]; then
            feed_job="$(gh run view "$run_id" -R "$REPO" --json jobs \
              --jq '[.jobs[] | select(.name == "Publish the update feeds" and .conclusion == "failure")][0].databaseId // ""')"
            if [ -n "$feed_job" ] && [ "$attempt" -lt 3 ]; then
              gh run rerun "$run_id" -R "$REPO" --job "$feed_job"
              say "release: redeploying the feeds of run $run_id (attempt $((attempt + 1)))"
              exit 0
            fi
          fi

          # A failed release of this very commit isn't retried every hour; a new commit or a manual run is.
          read -r last_sha last_conclusion < <(gh run list -R "$REPO" --workflow release.yml --branch canary \
            --limit 1 --json headSha,conclusion --jq '.[0] | "\(.headSha // "-") \(.conclusion // "-")"' || echo "- -")
          if [ "$last_sha" = "$head" ] && [ "$last_conclusion" != success ]; then
            say "release: the last run for ${head:0:12} ended $last_conclusion; not retrying on a timer"
            exit 0
          fi

          tag="$(gh release list -R "$REPO" --exclude-drafts --exclude-pre-releases --limit 50 \
            --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v"))] | sort_by(.publishedAt) | last | .tagName // ""')"
          now="$(python3 -I scripts/fork/upstream-version.py)"
          reason=""
          if [ -z "$tag" ]; then
            reason="no release yet"
          else
            base="$(git rev-list -n 1 "refs/tags/$tag")"
            if [[ "$tag" =~ ^v([0-9.]+)-r[0-9]+(-webkit)?$ ]]; then was="${BASH_REMATCH[1]}"
            else was="$(git show "$base:VERSION" | tr -d '[:space:]')"; fi
            if [ "$was" != "$now" ]; then
              reason="upstream $was -> $now"
            elif [ "$base" = "$head" ]; then
              say "release: $tag is canary's head and upstream is still $now"; exit 0
            else
              # Fork commits that touch the app; docs and CI alone don't warrant a signed build.
              changed="$(git rev-list --no-merges --count "$base..HEAD" ^"upstream/$UPSTREAM_BRANCH" \
                -- . ':(exclude)*.md' ':(exclude)docs' ':(exclude).github')"
              [ "$changed" = 0 ] || reason="fork changes since $tag: $changed"
            fi
          fi
          if [ -z "$reason" ]; then say "release: nothing new since $tag beyond upstream commits"; exit 0; fi

          gh workflow run release.yml -R "$REPO" --ref canary -f engines=all
          say "release: started for ${head:0:12} ($reason)"
