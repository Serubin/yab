# Hourly sync of upstream yetanotherbrowser/yab main: main mirrors it, canary merges it, and
# half an hour later a release of each flavor of canary that lacks upstream's newest version or the fork's changes since its last one.

name: Sync upstream

on:
  schedule:
    # Each job keys on its own cron string; keep them in step with the `if:` lines below.
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/yetanotherbrowser/yab.git
  UPSTREAM_BRANCH: main
  # Merged into; main is fast-forwarded separately.
  BRANCHES: canary

jobs:
  sync:
    name: Merge upstream
    if: github.repository == 'Serubin/yab' && github.event.schedule != '30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # GITHUB_TOKEN may not push commits that touch .github/workflows; SYNC_TOKEN needs contents and workflows write.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keeps the fork's push credential off the upstream fetch.
          git -c http.https://github.com/.extraheader= \
            fetch --no-tags "$UPSTREAM_URL" "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"

          failed=()
          # main mirrors upstream exactly: fast-forward only, never a merge commit.
          upstream_sha="$(git rev-parse "upstream/$UPSTREAM_BRANCH")"
          if [ "$(git rev-parse origin/main)" = "$upstream_sha" ]; then
            echo "main: up to date"
          elif git merge-base --is-ancestor origin/main "$upstream_sha"; then
            git push origin "$upstream_sha:refs/heads/main"
            echo "main: fast-forwarded to $(git rev-parse --short "$upstream_sha")" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::main has commits upstream doesn't; reset it to upstream $UPSTREAM_BRANCH by hand."
            failed+=(main)
          fi

          for branch in $BRANCHES; do
            git checkout -q -B "$branch" "origin/$branch"
            if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
              echo "$branch: up to date"
              continue
            fi
            if ! git -c core.hooksPath=/dev/null merge --no-edit \
                -m "Merge upstream $UPSTREAM_BRANCH into $branch" "upstream/$UPSTREAM_BRANCH"; then
              git diff --name-only --diff-filter=U | sed "s/^/::error::$branch conflict: /"
              git merge --abort
              failed+=("$branch")
              continue
            fi
            git push origin "HEAD:refs/heads/$branch"
            echo "$branch: merged $(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Not synced: ${failed[*]}. Fix by hand."
            exit 1
          fi

  release:
    name: Release canary if it has news
    needs: sync
    # Runs when sync was skipped or hit a conflict on main: canary's own changes still deserve a release.
    if: ${{ !cancelled() && github.repository == 'Serubin/yab' && github.event.schedule != '0 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: canary
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Decide and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM_URL" "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          head="$(git rev-parse HEAD)"
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          busy="$(gh run list -R "$REPO" --workflow release.yml --limit 20 --json status \
            --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$busy" != 0 ]; then say "release: one is already running or queued"; exit 0; fi

          # Releases that shipped but whose Pages deploy failed: redeploy, up to three attempts.
          read -r run_id attempt < <(gh run list -R "$REPO" --workflow release.yml --branch canary \
            --status completed --limit 1 --json databaseId,attempt \
            --jq '.[0] | "\(.databaseId // "-") \(.attempt // 0)"' || echo "- 0")
          if [ "$run_id" != - ]; then
            feed_job="$(gh run view "$run_id" -R "$REPO" --json jobs \
              --jq '[.jobs[] | select(.name == "Publish the update feeds" and .conclusion == "failure")][0].databaseId // ""')"
            if [ -n "$feed_job" ] && [ "$attempt" -lt 3 ]; then
              gh run rerun "$run_id" -R "$REPO" --job "$feed_job"
              say "release: redeploying the feeds of run $run_id (attempt $((attempt + 1)))"
              exit 0
            fi
          fi

          # Per flavor: a release when it has none, upstream shipped, or the fork changed since its tag.
          # A flavor whose last build of this very commit failed isn't retried every hour; a new commit or a manual run is.
          releases="$RUNNER_TEMP/releases.json" runs="$RUNNER_TEMP/runs.json"
          gh release list -R "$REPO" --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName,publishedAt,isDraft,isPrerelease > "$releases"
          ids="$(gh run list -R "$REPO" --workflow release.yml --branch canary --commit "$head" --limit 10 \
            --json databaseId --jq '.[].databaseId')"
          for id in $ids; do
            gh run view "$id" -R "$REPO" --json databaseId,headSha,createdAt,jobs \
              --jq '{databaseId, headSha, createdAt, jobs: [.jobs[] | {name, conclusion}]}'
          done | jq -s . > "$runs"
          now="$(python3 -I scripts/fork/upstream-version.py)"
          plan="$(python3 -I scripts/fork/release-plan.py sync --releases "$releases" --runs "$runs" \
            --head "$head" --upstream "$now" --upstream-ref "upstream/$UPSTREAM_BRANCH")"
          jq -r '.flavors[] | "release \(.flavor): \(if .release then "yes" else "no" end), \(.reason)"' <<<"$plan" \
            | while IFS= read -r line; do say "$line"; done
          engines="$(jq -r .engines <<<"$plan")"
          if [ "$engines" = none ]; then say "release: nothing to start for ${head:0:12}"; exit 0; fi

          gh workflow run release.yml -R "$REPO" --ref canary -f engines="$engines"
          say "release: started $engines for ${head:0:12}"
