# Signed, notarized release of Pane, this fork, in two flavors: WebKit with Chromium
# (stock CEF), and WebKit only. Each flavor has its own feed, so an install stays on its own.
#
# Versions: upstream's newest release (scripts/fork/upstream-version.py: its site's latest
# build, or VERSION if higher) plus a fork revision, 0.50.2-r3. The revision counts
# this fork's canary releases of that upstream version and starts at r1 when it
# changes; both flavors of one run share it. A run that only adds the flavor the
# newest r lacks, at the commit that r was built from, reuses that r
# (scripts/fork/release-plan.py). The app shows it as its version.
# The updater compares only the 12-digit build number, which both flavors share too.
#
# Safety, read before changing this file:
#
# - Manual trigger (`workflow_dispatch`), by a person or by sync-upstream.yml on
#   canary. Nothing a pull request or a fork's code does can start it, so the
#   signing secrets never meet code a maintainer of this fork didn't merge.
# - Secrets live in the `release` environment, not the repository. Restrict
#   that environment's deployment branches to `canary`, plus any branch you
#   mean to cut prereleases from (Settings > Environments).
# - Only `canary` publishes the update feeds and the What's New page (GitHub Pages) and takes an r number.
#   Its LATEST_FLAVOR release is GitHub's "latest"; the other flavor's never is,
#   even when LATEST_FLAVOR's build fails. Installs follow their feed, not that mark.
#   Any other ref yields a prerelease versioned 0.47.19-dev.<build> that no
#   installed copy updates to.
# - GitHub-hosted runners only, no cache: a signed build starts from a clean tree.
# - Everything fetched from outside (CEF, YabCore's tools, dmgbuild by hash)
#   is in place before the signing key is; the key is imported non-exportable.
# - First-party actions only, pinned to a major tag as ci.yml does.
# - Repository variable YAB_XCODE (e.g. /Applications/Xcode_27.2.app) pins
#   the toolchain; without it the runner image's default Xcode is used.
#
# Secrets (environment `release`):
#   MACOS_CERT_P12         Developer ID Application certificate and key, .p12, base64
#   MACOS_CERT_PASSWORD    the .p12's password
#   NOTARY_KEY_P8          App Store Connect API key (.p8 file contents)
#   NOTARY_KEY_ID          that key's ID
#   NOTARY_ISSUER_ID       that key's issuer ID

name: Release

on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Flavors to build: all, chromium (WebKit + Chromium) or webkit (WebKit only)"
        type: choice
        options: [all, chromium, webkit]
        default: all

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  PANE_BUNDLE_ID: net.serubin.pane
  # The flavor whose canary release GitHub marks "latest": chromium or webkit.
  LATEST_FLAVOR: webkit
  # Pinned in docs/cef-packaging.md; fetch.sh only checks the CDN's own index.
  CEF_SHA1: 7359a9d293dd5c480bec3f18b762731b483b0e13

jobs:
  meta:
    name: Version and flavors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      upstream: ${{ steps.meta.outputs.upstream }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      publish: ${{ steps.meta.outputs.publish }}
      site: ${{ steps.meta.outputs.site }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version, build number and flavors
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ENGINES: ${{ inputs.engines }}
        run: |
          set -euo pipefail
          upstream="$(python3 -I scripts/fork/upstream-version.py)"
          build="$(date -u +%Y%m%d%H%M)"
          publish=false
          [ "$GITHUB_REF" = refs/heads/canary ] && publish=true
          if [ "$publish" = true ]; then
            # Fails on a tag that already exists, so a run never builds for hours toward a collision.
            refs="$RUNNER_TEMP/refs.json"
            gh api --paginate "repos/$REPO/git/matching-refs/tags/v$upstream-r" --jq '.[]' | jq -s . > "$refs"
            version="$(python3 -I scripts/fork/release-plan.py revision --refs "$refs" --upstream "$upstream" \
              --engines "$ENGINES" --sha "$GITHUB_SHA")"
          else
            version="$upstream-dev.$build"
          fi
          # build.sh's rule, checked here so a bad version fails before hours of CEF and signing.
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$ ]] \
            || { echo "::error::version $version (upstream $upstream) isn't one build.sh accepts"; exit 1; }
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$OWNER")"
          site="https://$owner.github.io/${REPO#*/}"
          chromium='{"flavor":"chromium","feed_dir":"pane","suffix":""}'
          webkit='{"flavor":"webkit","feed_dir":"pane/webkit","suffix":"-webkit"}'
          case "$ENGINES" in
            all) include="[$chromium,$webkit]" ;;
            chromium) include="[$chromium]" ;;
            webkit) include="[$webkit]" ;;
            *) echo "::error::unknown engines: $ENGINES"; exit 1 ;;
          esac
          case "$LATEST_FLAVOR" in
            chromium|webkit) ;;
            *) echo "::error::LATEST_FLAVOR is $LATEST_FLAVOR, not chromium or webkit"; exit 1 ;;
          esac
          {
            echo "upstream=$upstream"
            echo "version=$version"
            echo "build=$build"
            echo "publish=$publish"
            echo "site=$site"
            echo "matrix={\"include\":$include}"
          } >> "$GITHUB_OUTPUT"
          echo "Pane $version (upstream $upstream), build $build, flavors $ENGINES, publish: $publish" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Needs the full history and tags the checkout above fetched. Release notes for every ref;
      # only canary's go on the What's New page (the feed job).
      - name: What's new
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
          BUILD: ${{ steps.meta.outputs.build }}
          SITE: ${{ steps.meta.outputs.site }}
        run: |
          set -euo pipefail
          python3 -I scripts/fork/whats-new.py notes --version "$VERSION" --upstream "$UPSTREAM" \
            --head "$GITHUB_SHA" --repo "$REPO" --site "$SITE" \
            --date "${BUILD:0:4}-${BUILD:4:2}-${BUILD:6:2}" --out "$RUNNER_TEMP/whats-new"
          cat "$RUNNER_TEMP/whats-new/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the notes for the build and feed jobs
        uses: actions/upload-artifact@v4
        with:
          name: whats-new
          path: ${{ runner.temp }}/whats-new
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.flavor }}
    needs: meta
    # macOS 27 and Xcode 27 (a preview image): Yab's macOS 27 fixes compile only with Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 300
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    env:
      FLAVOR: ${{ matrix.flavor }}
      FEED_DIR: ${{ matrix.feed_dir }}
      TAG: v${{ needs.meta.outputs.version }}${{ matrix.suffix }}
      VERSION: ${{ needs.meta.outputs.version }}
      UPSTREAM: ${{ needs.meta.outputs.upstream }}
      BUILD: ${{ needs.meta.outputs.build }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      SITE: ${{ needs.meta.outputs.site }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: whats-new
          path: ${{ runner.temp }}/whats-new

      - name: Toolchain
        env:
          YAB_XCODE: ${{ vars.YAB_XCODE }}
        run: |
          set -euo pipefail
          if [ -n "$YAB_XCODE" ]; then
            test -d "$YAB_XCODE/Contents/Developer" || { echo "::error::no Xcode at $YAB_XCODE"; exit 1; }
            echo "DEVELOPER_DIR=$YAB_XCODE/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$YAB_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Build settings
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # canary's update card opens its entry on the What's New page; any other ref has no page.
          changelog="https://github.com/$REPO/releases/tag/$TAG"
          [ "$PUBLISH" != true ] || changelog="$SITE/pane/whats-new/#v$VERSION"
          {
            echo "YAB_VERSION=$VERSION"
            echo "YAB_BUILD_NUMBER=$BUILD"
            echo "YAB_DOWNLOAD_URL=$SITE/${FEED_DIR#.}"
            echo "YAB_CHANGELOG_URL=$changelog"
          } >> "$GITHUB_ENV"
          echo "Pane $VERSION ($FLAVOR), build $BUILD, tag $TAG, feed $SITE/${FEED_DIR#.}"

      # build.sh reuses a working .build/dmgbuild rather than pip-installing unpinned.
      - name: dmgbuild, pinned by hash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dmgbuild.txt" <<'REQ'
          dmgbuild==1.6.7 --hash=sha256:37ee5771c377beb3203d9164aae8046ffed8531c06edf9227f5788b3c599b1bf
          ds-store==1.3.3 --hash=sha256:b92a371efbf1b4ccce2a04d1ed13fceacc4736c81ba09cf5aefb74c088160a35
          mac-alias==2.2.3 --hash=sha256:7362b521d2132ef92f606a37abfed5fcd849ceb2f28b6f9743e014b02af92f0d
          REQ
          python3 -m venv .build/dmgbuild
          .build/dmgbuild/bin/pip install --quiet --require-hashes --only-binary :all: --no-deps \
            -r "$RUNNER_TEMP/dmgbuild.txt"
          .build/dmgbuild/bin/dmgbuild --help > /dev/null

      - name: Fetch CEF
        if: matrix.flavor == 'chromium'
        run: |
          set -euo pipefail
          cef="$(bash scripts/cef/fetch.sh)"
          grep -q "^$CEF_SHA1 " "$cef/.verified" \
            || { echo "::error::CEF archive isn't the pinned $CEF_SHA1"; exit 1; }
          echo "YAB_CEF_DIR=$cef" >> "$GITHUB_ENV"

      - name: Build PaneCore
        if: matrix.flavor == 'chromium'
        run: |
          set -euo pipefail
          helper_app="$(bash YabCore/build.sh | tail -1)"
          test -x "$helper_app/Contents/MacOS/PaneCore"
          echo "YAB_CEF_HELPER=$helper_app/Contents/MacOS/PaneCore" >> "$GITHUB_ENV"

      - name: Signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "::error::secret $name is not set in the release environment"; exit 1; }
          done
          secrets_dir="$RUNNER_TEMP/yab-signing"
          mkdir -p "$secrets_dir"
          keychain="$RUNNER_TEMP/yab-release.keychain-db"
          password_file="$secrets_dir/keychain-password"
          openssl rand -hex 32 > "$password_file"
          security create-keychain -p "$(cat "$password_file")" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$(cat "$password_file")" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$secrets_dir/cert.p12"
          security import "$secrets_dir/cert.p12" -k "$keychain" -f pkcs12 -x \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$secrets_dir/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$(cat "$password_file")" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            existing+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identities="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | tr -d '"' || true)"
          [ "$(grep -c . <<<"$identities")" = 1 ] \
            || { echo "::error::expected exactly one Developer ID Application identity in the .p12"; exit 1; }
          printf '%s\n' "$NOTARY_KEY_P8" > "$secrets_dir/notary.p8"
          xcrun notarytool store-credentials yab-fork --key "$secrets_dir/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain" > /dev/null
          rm -f "$secrets_dir/notary.p8"
          {
            echo "YAB_SIGN_IDENTITY=$identities"
            echo "YAB_SIGN_KEYCHAIN=$keychain"
            echo "YAB_RELEASE_PASSWORD_FILE=$password_file"
            echo "YAB_NOTARY_KEYCHAIN=$keychain"
            echo "YAB_NOTARY_PROFILE=yab-fork"
          } >> "$GITHUB_ENV"
          echo "signing as: $identities"

      - name: Build, sign and notarize Pane
        env:
          YAB_CEF: ${{ matrix.flavor == 'chromium' && '1' || '0' }}
        run: ./build.sh release ship

      - name: Check what was built
        run: |
          set -euo pipefail
          app="build/Pane.app"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Contents/Info.plist"; }
          [ "$(plist CFBundleIdentifier)" = "$PANE_BUNDLE_ID" ] || { echo "::error::bundle id is $(plist CFBundleIdentifier)"; exit 1; }
          [ "$(plist CFBundleVersion)" = "$BUILD" ] || { echo "::error::build is $(plist CFBundleVersion)"; exit 1; }
          [ "$(plist CFBundleShortVersionString)" = "$VERSION" ] \
            || { echo "::error::version is $(plist CFBundleShortVersionString)"; exit 1; }
          cef="$app/Contents/Frameworks/Chromium Embedded Framework.framework"
          if [ "$FLAVOR" = chromium ]; then
            test -x "$app/Contents/MacOS/PaneCore"
            test -d "$cef"
          else
            [ ! -e "$app/Contents/MacOS/PaneCore" ] && [ ! -e "$cef" ] \
              || { echo "::error::a WebKit-only build carries Chromium"; exit 1; }
          fi
          [ "$(plist YabFeed)" = "${YAB_DOWNLOAD_URL%/}/appcast.json" ] || { echo "::error::YabFeed is $(plist YabFeed)"; exit 1; }
          lipo -archs "$app/Contents/MacOS/pane" | grep -qw x86_64
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate build/pane.dmg
          spctl --assess --type open --context context:primary-signature -vv build/pane.dmg

      - name: Point the appcast at this release's files
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - build/appcast.json "https://github.com/$REPO/releases/download/$TAG" <<'PY'
          import json, sys
          path, base = sys.argv[1], sys.argv[2]
          cast = json.load(open(path))
          cast['url'] = base + '/pane.zip'
          cast['dmg'] = base + '/pane.dmg'
          json.dump(cast, open(path, 'w'), indent=2)
          print(json.dumps(cast, indent=2))
          PY
          [ ! -d build/Pane.app.dSYM ] || ditto -c -k --keepParent build/Pane.app.dSYM build/Pane.app.dSYM.zip

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          channel=(--prerelease)
          if [ "$PUBLISH" = true ]; then
            channel=(--latest=false)
            [ "$FLAVOR" != "$LATEST_FLAVOR" ] || channel=(--latest)
          fi
          title="Pane $VERSION"
          engines="Chromium tabs use stock CEF."
          if [ "$FLAVOR" = webkit ]; then
            title="Pane $VERSION (WebKit only)"
            engines="WebKit only."
          fi
          files=(build/pane.dmg build/pane.zip build/appcast.json)
          [ ! -f build/Pane.app.dSYM.zip ] || files+=(build/Pane.app.dSYM.zip)
          {
            cat "$RUNNER_TEMP/whats-new/notes.md"
            printf '\nUpstream Yab %s, build %s. Built from `%s` at %s. Signed and notarized. %s\n' \
              "$UPSTREAM" "$BUILD" "$REF_NAME" "$GITHUB_SHA" "$engines"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" "${channel[@]}" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${files[@]}"

      - name: Keep the appcast for the feed
        if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.flavor }}
          path: build/appcast.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain
        if: always()
        run: |
          [ -z "${YAB_SIGN_KEYCHAIN:-}" ] || security delete-keychain "$YAB_SIGN_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/yab-signing"

  feed:
    name: Publish the update feeds
    needs: [meta, build]
    # Runs when one flavor failed too: the one that shipped still gets its feed.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # For scripts/fork/whats-new.py.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          path: built

      - uses: actions/download-artifact@v4
        with:
          name: whats-new
          path: whats-new

      - name: Assemble the site
        id: site
        env:
          SITE: ${{ needs.meta.outputs.site }}
        run: |
          set -euo pipefail
          shipped=0
          # A Pages deploy replaces the whole site, so a feed this run didn't ship keeps its live copy.
          # The root and webkit/ feeds belong to the fork's earlier Yab-named builds and are only carried over.
          for pair in chromium:pane webkit:pane/webkit -:. -:webkit; do
            flavor="${pair%%:*}" dir="${pair#*:}"
            mkdir -p "feed/$dir"
            if [ -f "built/feed-$flavor/appcast.json" ]; then
              cp "built/feed-$flavor/appcast.json" "feed/$dir/appcast.json"
              shipped=$((shipped + 1))
              continue
            fi
            live="$SITE/${dir#.}"; live="${live%/}/appcast.json"
            code="$(curl -sS --retry 3 -H 'Cache-Control: no-cache' -o "feed/$dir/appcast.json" \
              -w '%{http_code}' "$live?run=$GITHUB_RUN_ID")"
            case "$code" in
              200) python3 -I -c 'import json,sys; json.load(open(sys.argv[1]))' "feed/$dir/appcast.json" ;;
              404) rm -f "feed/$dir/appcast.json"; echo "no feed at $live yet" ;;
              *) echo "::error::$live answered $code; not deploying a site without it"; exit 1 ;;
            esac
          done
          if [ "$shipped" -gt 0 ]; then
            # Same rule as the feeds: this release's entry joins the live page's, so history survives the deploy.
            live="$SITE/pane/whats-new/entries.json"
            args=()
            code="$(curl -sS --retry 3 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-entries.json" \
              -w '%{http_code}' "$live?run=$GITHUB_RUN_ID")"
            case "$code" in
              200) args=(--live "$RUNNER_TEMP/live-entries.json") ;;
              404) echo "no What's New page at $live yet" ;;
              *) echo "::error::$live answered $code; not deploying a site without it"; exit 1 ;;
            esac
            python3 -I scripts/fork/whats-new.py page --entry whats-new/entry.json --site "$SITE" \
              --out feed/pane/whats-new "${args[@]}"
          fi
          echo "shipped=$shipped" >> "$GITHUB_OUTPUT"
          find feed -type f
          [ "$shipped" -gt 0 ] || echo "::warning::no flavor shipped; the feeds stay as they are"

      - name: Feed for GitHub Pages
        if: steps.site.outputs.shipped != '0'
        uses: actions/upload-pages-artifact@v4
        with:
          path: feed

      - id: deploy
        if: steps.site.outputs.shipped != '0'
        uses: actions/deploy-pages@v4
